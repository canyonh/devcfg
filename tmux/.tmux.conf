# vim copy paste
#bind P paste-buffer
#bind-key -T copy-mode-vi y send-keys -X copy-selection

# Terminal settings for proper colors and focus events
set-option -g default-terminal "tmux-256color"
set-option -sa terminal-features ",xterm-256color:RGB"
set-option -sa terminal-overrides ",xterm-256color:Tc"

# Focus events (for autoread in vim/nvim)
set-option -g focus-events on

# History
set-option -g history-limit 200000

# Faster command sequences (recommended for vim/nvim)
set-option -sg escape-time 10

# monitor alert
set-window-option -g visual-bell on
set-window-option -g bell-action other

# Layout switching with Alt keys
bind-key -n M-0 select-layout tiled
bind-key -n M-1 select-layout even-horizontal
bind-key -n M-2 select-layout even-vertical
bind-key -n M-4 select-layout main-horizontal
bind-key -n M-5 select-layout main-vertical

# Split with 2/3 width for current pane
bind-key e split-window -h -p 33

# Split with 1/3 width for current pane
bind-key t split-window -h -p 67

# Pane borders
set -g pane-border-style fg=colour238
set -g pane-active-border-style "#{?window_zoomed_flag,fg=colour172#,bg=colour229,fg=colour39#,bg=colour24}"
set -g pane-border-lines double
set -g pane-border-indicators colour
set -g pane-border-status top
set -g pane-border-format '#(~/devcfg/tmux/pane-format.sh "#{pane_active}" "#{pane_index}" "#{pane_current_command}" "#{pane_current_path}")'

# Status bar
set -g status-style bg=colour235,fg=colour250
set -g status-left-length 40
set -g status-right-length 80
set -g status-left "#[fg=colour16,bg=colour39,bold] #S #[fg=colour39,bg=colour235] "
set -g status-right "#[fg=colour250] #(~/devcfg/tmux/status-stats.sh) | #(whoami)@#H | %Y-%m-%d %H:%M "

# Window tabs
set -g window-status-format " #I:#W "
set -g window-status-current-format "#[fg=colour16,bg=colour39,bold] #I:#W #[default]"
set -g window-status-separator ""

# Message styling
set -g message-style bg=colour39,fg=colour16
